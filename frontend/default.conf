server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Add Link headers for agent discovery (RFC 8288)
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs>; rel="service-doc"' always;

        # Content negotiation for Markdown for Agents
        if ($http_accept ~* "text/markdown") {
            rewrite ^/$ /index.md last;
        }

        try_files $uri $uri/ /index.html;
    }

    location = /index.md {
        root /usr/share/nginx/html;
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header x-markdown-tokens "180" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs>; rel="service-doc"' always;
    }

    location = /.well-known/api-catalog {
        root /usr/share/nginx/html;
        default_type application/linkset+json;
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
    }

    location = /.well-known/oauth-protected-resource {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/oauth-authorization-server {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/openid-configuration {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
