server {
    listen 8080;
    server_name localhost;

    # Global Security Headers (inherited by locations without add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Security headers repeated due to Nginx's header redefinition behavior
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs>; rel="service-doc"' always;

        # Content negotiation for Markdown for Agents
        if ($http_accept ~* "text/markdown") {
            rewrite ^/$ /index.md last;
        }

        try_files $uri $uri/ /index.html;
    }

    location = /index.md {
        root /usr/share/nginx/html;
        default_type "text/markdown; charset=utf-8";
        
        # Security headers repeated due to Nginx's header redefinition behavior
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
        add_header x-markdown-tokens "180" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </docs>; rel="service-doc"' always;
    }

    location = /.well-known/api-catalog {
        root /usr/share/nginx/html;
        default_type "application/linkset+json; charset=utf-8";
    }

    location = /.well-known/oauth-protected-resource {
        root /usr/share/nginx/html;
        default_type "application/json; charset=utf-8";
    }

    location = /.well-known/oauth-authorization-server {
        root /usr/share/nginx/html;
        default_type "application/json; charset=utf-8";
    }

    location = /.well-known/openid-configuration {
        root /usr/share/nginx/html;
        default_type "application/json; charset=utf-8";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
