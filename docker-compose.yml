services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGINS=*
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/chikguard.db}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped

  sync_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scripts/sync_worker.py
    restart: always
    depends_on:
      - backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/chikguard.db}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./data:/app/data
