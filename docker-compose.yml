services:
  backend:
    networks:
      - backend-network
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/chikguard.db}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/chikguard}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  mongo:
    image: mongo:latest
    networks:
      - backend-network
    ports:
      # Restrito a localhost para evitar exposição pública sem autenticação
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chikguard
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - backend-network
      - frontend-network
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - frontend-network
    restart: unless-stopped

  sync_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scripts/sync_worker.py
    restart: unless-stopped
    networks:
      - backend-network
    depends_on:
      - backend
      - mongo
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/chikguard.db}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/chikguard}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./data:/app/data

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true

volumes:
  mongo_data:
    driver: local
